# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: MiScaleHealth
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  MiScaleKit:
    path: MiScaleKit

settings:
  base:
    # Change APP_BUNDLE_ID to your own reverse-DNS ID; the widget and app group follow it.
    APP_BUNDLE_ID: com.example.MiScaleHealth
    APP_GROUP_ID: group.$(APP_BUNDLE_ID)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""        # set your team here or in Xcode › Signing & Capabilities
    CODE_SIGN_STYLE: Automatic

targets:
  MiScaleHealth:
    type: application
    platform: watchOS
    sources:
      - App
    dependencies:
      - package: MiScaleKit
      - target: ScaleWidget
      - sdk: HealthKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Scale
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Scale
        AppGroupID: $(APP_GROUP_ID)
        WKApplication: true
        WKWatchOnly: true
        WKRunsIndependentlyOfCompanionApp: true
        NSBluetoothAlwaysUsageDescription: Scale listens for your Mi Body Composition Scale's Bluetooth broadcasts to read your weight.
        NSHealthShareUsageDescription: Scale reads your height, date of birth and sex to calculate BMI and body composition.
        NSHealthUpdateUsageDescription: Scale saves your weight, BMI, body fat percentage and lean body mass to Health.
    entitlements:
      path: App/MiScaleHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)

  # Smart Stack / watch-face widget
  ScaleWidget:
    type: app-extension
    platform: watchOS
    sources:
      - Widget
    dependencies:
      - package: MiScaleKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        PRODUCT_NAME: ScaleWidget
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Scale
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ScaleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
